<button class="notification-btn">
    <i class="fas fa-bell"></i>
    <span class="notification-badge"></span>
</button>
<style>
.user-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #e0e0e0;
    display: inline-block;
}
.user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}
</style>
<div class="user-avatar">
    {% if user %}
        <img src="{{ user.picture or url_for('static', path='images/default-profile.png') }}"
    {% else %}
        <img src="{{ url_for('static', path='images/default-profile.png') }}"
    {% endif %}
         alt="User Image"
         id="user-avatar-img"
         style="cursor:pointer;"
         onclick="toggleUserMenu(event)"
         class="user-image mb-3 shadow"
         loading="lazy">
</div>
<div class="user-menu" id="user-menu" style="display: none; position: absolute; top: 60px; right: 0; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); min-width: 180px; z-index: 1000; padding: 10px 0;">
    <ul class="list-unstyled mb-0">
        <li>
            <a href="{{ url_for('enterprise_profile')}}" class="dropdown-item" style="padding: 10px 20px; display: flex; align-items: center;">
                <i class="fas fa-user" style="margin-right: 8px;"></i> Profile
            </a>
        </li>
        <li>
            <a href="" class="dropdown-item" style="padding: 10px 20px; display: flex; align-items: center;" onclick="logoutUser(event)">
                <i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i> Logout
            </a>
        </li>
    </ul>
</div>
<script>
function toggleUserMenu(event) {
    event.stopPropagation();
    const userMenu = document.getElementById('user-menu');
    if (userMenu.style.display === 'none' || userMenu.style.display === '') {
        userMenu.style.display = 'block';
    } else {
        userMenu.style.display = 'none';
    }
}       
async function logoutUser(event) {
    event.preventDefault();
    // Call logout endpoint to clear session/cookies
    localStorage.clear();
    document.cookie.split(";").forEach(function(c) {
        document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date(0).toUTCString() + ";path=/");
    });
    await fetch('/logout', { method: 'POST', credentials: 'include' });
    // Redirect to login page
    window.location.href = '/login';
};
</script>
