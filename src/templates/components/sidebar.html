<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="user-image-wrapper">
            <img src="{% if user and user.picture %}{{ user.picture }}{% else %}{{ url_for('static', path='images/default-profile.png') }}{% endif %}"
            alt="User Image"
            class="user-image rounded-circle mb-3 shadow"
            width="72"
            height="72"
            loading="lazy"
            style="object-fit: cover; border: 2px solid #e0e0e0;">
        </div>
      
       
        <div class="brand-text">
            {% if user and user.name %}
                <h5 class="mb-1">{{ user.name }}</h5>
            {% else %}
                <h5 class="mb-1">Default Name</h5>
            {% endif %}
            <small>Enterprise Dashboard</small>
        </div>
    </div>
    
    <div class="sidebar-nav">
        {% include 'components/nav_links.html' %}
    </div>
</nav>
